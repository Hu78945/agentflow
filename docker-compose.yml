services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: agentflow
      POSTGRES_DB: agentflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow"]
      interval: 2s
      retries: 30

  temporal:
    image: temporalio/temporal:1.10.0
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0"]
    ports: ["7233:7233", "8233:8233"] # gRPC, Web UI
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 2s
      retries: 30

  worker:
    build: .
    command: ["node", "dist/src/worker.js"]
    env_file: [{ path: .env, required: false }]
    environment: &env
      DATABASE_URL: postgres://agentflow:agentflow@postgres:5432/agentflow
      TEMPORAL_ADDRESS: temporal:7233
    depends_on: &deps
      postgres: { condition: service_healthy }
      temporal: { condition: service_healthy }
    restart: on-failure

  api:
    build: .
    command: ["node", "dist/src/main.js"]
    env_file: [{ path: .env, required: false }]
    environment: *env
    ports: ["3000:3000"]
    depends_on: *deps
    restart: on-failure

volumes:
  pgdata:
